# Prometheus + Grafana Helm Chart Values
prometheus:
  enabled: true

  serviceAccount:
    create: true
    name: prometheus

  alertmanager:
    enabled: false

  pushgateway:
    enabled: false

  server:
    persistentVolume:
      enabled: false

  extraScrapeConfigs: |
    - job_name: 'kubernetes-apiservers'
      kubernetes_sd_configs:
        - role: endpoints
      scheme: https
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      relabel_configs:
        - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
          action: keep
          regex: default;kubernetes;https

    - job_name: 'kubernetes-nodes'
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true

grafana:
  enabled: true

  adminPassword: admin

  serviceAccount:
    create: true
    name: grafana

  persistence:
    enabled: false

  dashboards:
    default:
      kubernetes:
        gnetId: 12740
        revision: 1
