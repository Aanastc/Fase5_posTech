# Configuração correta para o kube-prometheus-stack

grafana:
  enabled: true
  adminPassword: "prom-operator"

  persistence:
    enabled: false

prometheus:
  enabled: true

  prometheusSpec:
    ruleSelector:
      matchLabels:
        release: prometheus

    retention: 1d

alertmanager:
  enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
