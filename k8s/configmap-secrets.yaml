apiVersion: v1
kind: ConfigMap
metadata:
  name: solidarytech-config
  namespace: solidarytech
data:
  AWS_REGION: "us-east-1"
  DYNAMODB_TABLE: "PLACEHOLDER_DYNAMODB_TABLE"
  NGO_PORT: "8081"
  DONATION_PORT: "8082"
  VOLUNTEER_PORT: "8083"

---
apiVersion: v1
kind: Secret
metadata:
  name: solidarytech-secrets
  namespace: solidarytech
type: Opaque
stringData:
  # ATENÇÃO: Em ambiente real (DevSecOps), secrets são gerenciados via AWS Secrets Manager ou Vault.
  # Placeholders mantidos apenas para validação do manifesto.
  DATABASE_URL: "postgres://postgres_admin:PLACEHOLDER_PASSWORD@RDS_ENDPOINT:5432/solidarytech"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/ACCOUNT_ID/solidary-donations"
