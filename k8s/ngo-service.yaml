apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngo-service
  namespace: solidarytech
  labels:
    app: ngo-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ngo-service
  template:
    metadata:
      labels:
        app: ngo-service
    spec:
      containers:
        - name: ngo-service
          image: solidarytech/ngo-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: solidarytech-config
          # FinOps: Rightsizing obrigatório (Limites e Pedidos)
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: ngo-service
  namespace: solidarytech
spec:
  selector:
    app: ngo-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
