apiVersion: apps/v1
kind: Deployment
metadata:
  name: volunteer-service
  labels:
    app: volunteer-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: volunteer-service
  template:
    metadata:
      labels:
        app: volunteer-service
    spec:
      containers:
      - name: volunteer-service
        image: solidarytech/volunteer-service:latest
        ports:
        - containerPort: 8083
        envFrom:
        - configMapRef:
            name: solidarytech-config
        # FinOps: Rightsizing obrigatório (Limites e Pedidos)
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: volunteer-service
spec:
  selector:
    app: volunteer-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8083
