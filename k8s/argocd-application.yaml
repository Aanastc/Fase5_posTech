apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: solidarytech-apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/Aanastc/Fase5_posTech.git"
    targetRevision: HEAD
    path: k8s
  destination:
    server: "https://kubernetes.default.svc"
    namespace: solidarytech
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
