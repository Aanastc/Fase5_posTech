apiVersion: apps/v1
kind: Deployment
metadata:
  name: donation-service
  namespace: solidarytech
  labels:
    app: donation-service
spec:
  # Donation Service é o Hot Path, começamos com mais réplicas e podemos usar HPA depois
  replicas: 3
  selector:
    matchLabels:
      app: donation-service
  template:
    metadata:
      labels:
        app: donation-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: donation-service
          image: solidarytech/donation-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: solidarytech-config
          # FinOps: Rightsizing. Sendo Go, gasta menos memória, mas se for hot path pode precisar de CPU.
          resources:
            requests:
              memory: "64Mi"
              cpu: "200m"
            limits:
              memory: "128Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: donation-service
  namespace: solidarytech
spec:
  selector:
    app: donation-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8082
