name: Full Deploy Pipeline

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite DEPLOY-TUDO para confirmar o deploy completo"
        required: true
        type: string

jobs:
  # ============================================
  # STEP 1: Terraform Apply
  # ============================================
  terraform-apply:
    name: Step 1 - Terraform Apply
    runs-on: ubuntu-latest
    steps:
      - name: Verify Deploy Confirmation
        run: |
          if [ "${{ github.event.inputs.confirmacao }}" != "DEPLOY-TUDO" ]; then
            echo "Erro: Você precisa digitar 'DEPLOY-TUDO' para confirmar o deploy."
            exit 1
          fi
          echo "Deploy confirmado!"

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="solidarytech-terraform-state-${ACCOUNT_ID}"
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "bucket_name=${BUCKET_NAME}" >> $GITHUB_OUTPUT

      - name: Create S3 Bucket
        run: |
          BUCKET="${{ steps.account.outputs.bucket_name }}"
          if aws s3api head-bucket --bucket "${BUCKET}" --region us-east-1 2>/dev/null; then
            echo "Bucket ${BUCKET} ja existe"
          else
            echo "Criando bucket ${BUCKET}..."
            aws s3api create-bucket --bucket "${BUCKET}" --region us-east-1
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        env:
          BUCKET_NAME: ${{ steps.account.outputs.bucket_name }}
        run: |
          echo "Inicializando Terraform com bucket: ${BUCKET_NAME}"
          terraform init -reconfigure -upgrade -backend-config="bucket=${BUCKET_NAME}"
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="db_password=${{ secrets.DB_PASSWORD }}"
        working-directory: ./terraform

  # ============================================
  # STEP 2: ECR Build & Push
  # ============================================
  ecr-build-push:
    name: Step 2 - ECR Build & Push
    runs-on: ubuntu-latest
    needs: terraform-apply
    strategy:
      matrix:
        service:
          - name: ngo-service
            path: ngo-service
          - name: donation-service
            path: donation-service
          - name: volunteer-service
            path: volunteer-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: ECR Login
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build & Push Image
        run: |
          IMAGE="${{ steps.account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com/solidarytech/${{ matrix.service.name }}:latest"
          docker build -t "${IMAGE}" ${{ matrix.service.path }}/
          docker push "${IMAGE}"

  # ============================================
  # STEP 3: K8s Deploy
  # ============================================
  k8s-deploy:
    name: Step 3 - K8s Deploy
    runs-on: ubuntu-latest
    needs: ecr-build-push
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get AWS Resources
        id: resources
        run: |
          echo "rds_address=$(aws rds describe-db-instances --query 'DBInstances[0].Endpoint.Address' --output text)" >> $GITHUB_OUTPUT
          echo "sqs_url=$(aws sqs get-queue-url --queue-name solidary-donations --query 'QueueUrl' --output text)" >> $GITHUB_OUTPUT
          echo "dynamodb_table=$(aws dynamodb list-tables --query 'TableNames[0]' --output text)" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name solidarytech-cluster

      - name: Create Namespace
        run: kubectl apply -f k8s/namespace.yaml

      # --- CORREÇÃO COM --server-side AQUI ---
      - name: Install Argo CD CRDs and Server
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply --server-side -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
          sleep 10

      - name: Register App in Argo CD
        run: |
          if [ -f k8s/argocd-application.yaml ]; then
            kubectl apply -f k8s/argocd-application.yaml -n argocd
          fi

      - name: Update ConfigMap
        run: |
          kubectl create configmap solidarytech-config \
            --from-literal=DATABASE_URL="postgres://postgres_admin:${{ secrets.DB_PASSWORD }}@${{ steps.resources.outputs.rds_address }}:5432/solidarytech" \
            --from-literal=AWS_SQS_URL="${{ steps.resources.outputs.sqs_url }}" \
            --from-literal=DYNAMODB_TABLE="${{ steps.resources.outputs.dynamodb_table }}" \
            --namespace=solidarytech \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Services with Direct ECR Registry
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com"

          # Substitui a imagem genérica pela URL completa do ECR nos arquivos antes de aplicar
          sed -i "s|solidarytech/ngo-service:latest|${ECR_REGISTRY}/solidarytech/ngo-service:latest|g" k8s/ngo-service.yaml
          sed -i "s|solidarytech/donation-service:latest|${ECR_REGISTRY}/solidarytech/donation-service:latest|g" k8s/donation-service.yaml
          sed -i "s|solidarytech/volunteer-service:latest|${ECR_REGISTRY}/solidarytech/volunteer-service:latest|g" k8s/volunteer-service.yaml

          # Aplica os arquivos já apontando diretamente para o ECR
          kubectl apply -f k8s/ngo-service.yaml -n solidarytech
          kubectl apply -f k8s/donation-service.yaml -n solidarytech
          kubectl apply -f k8s/volunteer-service.yaml -n solidarytech

          # Garante o restart para pegar o ConfigMap atualizado
          kubectl rollout restart deployment/ngo-service -n solidarytech
          kubectl rollout restart deployment/donation-service -n solidarytech
          kubectl rollout restart deployment/volunteer-service -n solidarytech

  # ============================================
  # STEP 4: Monitoring (Prometheus + Grafana)
  # ============================================
  monitoring-deploy:
    name: Step 4 - Monitoring Setup
    runs-on: ubuntu-latest
    needs: k8s-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name solidarytech-cluster

      - name: Add Helm Repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Install Prometheus & Grafana
        run: |
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            -n monitoring \
            --create-namespace \
            -f k8s/monitoring/prometheus-values.yaml

      - name: Apply Prometheus Rules
        run: |
          if [ -f k8s/monitoring/alerts/prometheus-rules.yaml ]; then
            echo "Aguardando CRDs do Prometheus estarem disponíveis..."
            sleep 10
            kubectl apply -f k8s/monitoring/alerts/prometheus-rules.yaml -n monitoring
          fi

      - name: Verify Monitoring
        run: |
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring
