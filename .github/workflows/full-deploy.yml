name: Full Deploy Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"
      - "k8s/**"
      - "ngo-service/**"
      - "donation-service/**"
      - "volunteer-service/**"

jobs:
  # ============================================
  # STEP 1: Terraform Apply
  # ============================================
  terraform-apply:
    name: Step 1 - Terraform Apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Account ID
        id: account
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT
          echo "bucket_name=solidarytech-tf-state-$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Create S3 Bucket
        run: |
          BUCKET="${{ steps.account.outputs.bucket_name }}"
          if aws s3api head-bucket --bucket "${BUCKET}" --region us-east-1 2>/dev/null; then
            echo "Bucket ${BUCKET} ja existe"
          else
            aws s3api create-bucket --bucket "${BUCKET}" --region us-east-1
          fi

      - name: Terraform Init
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.0

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform

  # ============================================
  # STEP 2: ECR Build & Push
  # ============================================
  ecr-build-push:
    name: Step 2 - ECR Build & Push
    runs-on: ubuntu-latest
    needs: terraform-apply
    strategy:
      matrix:
        service:
          - name: ngo-service
            path: ngo-service
          - name: donation-service
            path: donation-service
          - name: volunteer-service
            path: volunteer-service
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Account ID
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: ECR Login
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build & Push Image
        run: |
          IMAGE="${{ steps.account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com/solidarytech/${{ matrix.service.name }}:latest"
          docker build -t "${IMAGE}" ${{ matrix.service.path }}/
          docker push "${IMAGE}"

  # ============================================
  # STEP 3: K8s Deploy
  # ============================================
  k8s-deploy:
    name: Step 3 - K8s Deploy
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get AWS Resources
        id: resources
        run: |
          echo "rds_address=$(aws rds describe-db-instances --query 'DBInstances[0].Endpoint.Address' --output text)" >> $GITHUB_OUTPUT
          echo "sqs_url=$(aws sqs get-queue-url --queue-name solidary-donations --query 'QueueUrl' --output text)" >> $GITHUB_OUTPUT
          echo "dynamodb_table=$(aws dynamodb list-tables --query 'TableNames[0]' --output text)" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name solidarytech-cluster

      - name: Create Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Update ConfigMap
        run: |
          kubectl create configmap solidarytech-config \
            --from-literal=DATABASE_URL="postgres://admin:SolidaryTech2024@${{ steps.resources.outputs.rds_address }}:5432/solidarytech" \
            --from-literal=AWS_SQS_URL="${{ steps.resources.outputs.sqs_url }}" \
            --from-literal=DYNAMODB_TABLE="${{ steps.resources.outputs.dynamodb_table }}" \
            --namespace=solidarytech \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Services
        run: |
          kubectl apply -f k8s/ngo-service.yaml
          kubectl apply -f k8s/donation-service.yaml
          kubectl apply -f k8s/volunteer-service.yaml

      - name: Restart Deployments
        run: |
          kubectl rollout restart deployment/ngo-service -n solidarytech
          kubectl rollout restart deployment/donation-service -n solidarytech
          kubectl rollout restart deployment/volunteer-service -n solidarytech

  # ============================================
  # STEP 4: Monitoring (Prometheus + Grafana)
  # ============================================
  monitoring-deploy:
    name: Step 4 - Monitoring Setup
    runs-on: ubuntu-latest
    needs: terraform-apply
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name solidarytech-cluster

      - name: Add Helm Repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Install Prometheus & Grafana
        run: |
          helm install prometheus prometheus-community/kube-prometheus-stack \
            -n monitoring \
            --create-namespace \
            -f k8s/monitoring/prometheus-values.yaml

      - name: Verify Monitoring
        run: |
          kubectl get pods -n monitoring
          kubectl get svc -n monitoring
