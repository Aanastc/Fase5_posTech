name: Terraform Validate Plan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get AWS Account ID
        id: account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          echo "bucket_name=solidarytech-tf-state-${ACCOUNT_ID}" >> $GITHUB_OUTPUT

      - name: Create S3 bucket if not exists
        run: |
          BUCKET="${{ steps.account.outputs.bucket_name }}"
          REGION="us-east-1"
          if aws s3api head-bucket --bucket "${BUCKET}" --region "${REGION}" 2>/dev/null; then
            echo "Bucket ${BUCKET} ja existe."
          else
            echo "Criando bucket ${BUCKET}..."
            aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}"
            echo "Bucket criado com sucesso!"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="bucket=${{ steps.account.outputs.bucket_name }}"
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan
        run: terraform plan -var="db_password=${{ secrets.DB_PASSWORD }}"
        working-directory: ./terraform
