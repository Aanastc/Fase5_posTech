name: Volunteer Service CI

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "volunteer-service/**"

jobs:
  build-and-push-ecr:
    name: Build & Push Volunteer Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Account ID & Login to ECR
        id: ecr-login
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com

      - name: Create ECR Repository if not exists
        run: |
          aws ecr create-repository --repository-name solidarytech/volunteer-service --region us-east-1 || true

      - name: Build & Push Docker Image
        run: |
          ACCOUNT_ID="${{ steps.ecr-login.outputs.account_id }}"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/solidarytech/volunteer-service:latest"
          docker build -t "${IMAGE}" ./volunteer-service/
          docker push "${IMAGE}"

  deploy-service:
    name: Deploy Volunteer Service
    runs-on: ubuntu-latest
    needs: build-and-push-ecr
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name solidarytech-cluster

      - name: Apply Namespace
        run: kubectl apply -f k8s/namespace.yaml

      - name: Deploy Service
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com"

          # 1. Substitui a imagem genérica pela URL completa do ECR no YAML antes de aplicar
          sed -i "s|solidarytech/volunteer-service:latest|${ECR_REGISTRY}/solidarytech/volunteer-service:latest|g" k8s/volunteer-service.yaml

          # 2. Aplica o manifesto atualizado no namespace correto
          kubectl apply -f k8s/volunteer-service.yaml -n solidarytech

          # 3. Força a reinicialização para carregar a nova imagem do ECR
          kubectl rollout restart deployment/volunteer-service -n solidarytech
