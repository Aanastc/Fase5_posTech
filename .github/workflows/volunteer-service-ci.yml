name: Volunteer Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'volunteer-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'volunteer-service/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image (Local)
        uses: docker/build-push-action@v4
        with:
          context: ./volunteer-service
          file: ./volunteer-service/Dockerfile
          push: false
          tags: ${{ steps.login-ecr.outputs.registry }}/solidarytech/volunteer-service:latest
          load: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ steps.login-ecr.outputs.registry }}/solidarytech/volunteer-service:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push ${{ steps.login-ecr.outputs.registry }}/solidarytech/volunteer-service:latest
