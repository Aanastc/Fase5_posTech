name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite EXECUTAR para confirmar o deploy manual"
        required: true
        type: string
  push:
    branches:
      - main
      - develop
    paths:
      - "terraform/**"

jobs:
  # ============================================
  # STEP 1: Create S3 Bucket
  # ============================================
  create-s3-bucket:
    name: Step 1 - Create S3 Bucket
    runs-on: ubuntu-latest
    outputs:
      bucket_name: ${{ steps.account.outputs.bucket_name }}
      account_id: ${{ steps.account.outputs.account_id }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get AWS Account ID
        id: account
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT
          echo "bucket_name=solidarytech-tf-state-$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Create S3 Bucket
        run: |
          BUCKET="${{ steps.account.outputs.bucket_name }}"
          REGION="us-east-1"
          if aws s3api head-bucket --bucket "${BUCKET}" --region "${REGION}" 2>/dev/null; then
            echo "Bucket ${BUCKET} ja existe"
          else
            echo "Criando bucket ${BUCKET}..."
            aws s3api create-bucket --bucket "${BUCKET}" --region "${REGION}"
            echo "Bucket criado com sucesso!"
          fi

  # ============================================
  # STEP 2: Terraform Apply
  # ============================================
  terraform-apply:
    name: Step 2 - Terraform Apply
    runs-on: ubuntu-latest
    needs: create-s3-bucket
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Verify Deploy Confirmation
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.confirmacao }}" != "EXECUTAR" ]; then
              echo "Erro: Você precisa digitar 'EXECUTAR' para confirmar o deploy manual."
              exit 1
            fi
            echo "Deploy manual confirmado!"
          else
            echo "Deploy automático (push/merge) confirmado!"
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="bucket=${{ needs.create-s3-bucket.outputs.bucket_name }}"
        working-directory: ./terraform

      - name: Terraform Apply
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')) || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve
        working-directory: ./terraform
