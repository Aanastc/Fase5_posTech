name: Deploy Manual Services

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite EXECUTAR para confirmar o deploy manual"
        required: true
        type: string

jobs:
  # ============================================
  # STEP 1: Build & Push to ECR (Paralelo)
  # ============================================
  build-and-push-ecr:
    name: Step 1 - Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ngo-service
          - donation-service
          - volunteer-service
    steps:
      - name: Verify Deploy Confirmation
        run: |
          if [ "${{ github.event.inputs.confirmacao }}" != "EXECUTAR" ]; then
            echo "Erro: Você precisa digitar 'EXECUTAR' para confirmar o deploy manual."
            exit 1
          fi
          echo "Deploy manual confirmado!"

      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get Account ID & Login to ECR
        id: ecr-login
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=${ACCOUNT_ID}" >> $GITHUB_OUTPUT
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com

      - name: Create ECR Repository if not exists
        run: |
          aws ecr create-repository --repository-name solidarytech/${{ matrix.service }} --region us-east-1 || true

      - name: Build & Push Docker Image
        run: |
          ACCOUNT_ID="${{ steps.ecr-login.outputs.account_id }}"
          IMAGE="${ACCOUNT_ID}.dkr.ecr.us-east-1.amazonaws.com/solidarytech/${{ matrix.service }}:latest"

          docker build -t "${IMAGE}" ./${{ matrix.service }}/
          docker push "${IMAGE}"

  # ============================================
  # STEP 2: Deploy Services to EKS
  # ============================================
  deploy-services:
    name: Step 2 - Deploy Services
    runs-on: ubuntu-latest
    needs: build-and-push-ecr
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region us-east-1 --name solidarytech-cluster

      - name: Apply K8s Manifests & Restart Deployments
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/ngo-service.yaml
          kubectl apply -f k8s/donation-service.yaml
          kubectl apply -f k8s/volunteer-service.yaml

          kubectl rollout restart deployment/ngo-service -n solidarytech
          kubectl rollout restart deployment/donation-service -n solidarytech
          kubectl rollout restart deployment/volunteer-service -n solidarytech
