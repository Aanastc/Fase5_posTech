name: Build and Push to ECR

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: "Digite EXECUTAR para confirmar o build manual"
        required: true
        type: string
  push:
    branches:
      - main
      - develop
    paths:
      - "ngo-service/**"
      - "donation-service/**"
      - "volunteer-service/**"

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: ngo-service
            path: ngo-service
          - name: donation-service
            path: donation-service
          - name: volunteer-service
            path: volunteer-service
    steps:
      - name: Verify Deploy Confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirmacao }}" != "EXECUTAR" ]; then
            echo "Erro: Você precisa digitar 'EXECUTAR' para confirmar o build manual."
            exit 1
          fi
          echo "Build manual confirmado!"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Get AWS Account ID
        id: account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ steps.account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com

      - name: Build and Push
        run: |
          ECR_REPO="solidarytech/${{ matrix.service.name }}"
          IMAGE_TAG="${{ steps.account.outputs.account_id }}.dkr.ecr.us-east-1.amazonaws.com/${ECR_REPO}:latest"
          docker build -t "${IMAGE_TAG}" ${{ matrix.service.path }}/
          docker push "${IMAGE_TAG}"
