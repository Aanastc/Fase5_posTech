name: Service Validation (PR Only)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "donation-service/**"
      - "ngo-service/**"
      - "volunteer-service/**"

jobs:
  # ============================================
  # STEP 1: Validação de Serviços Go (donation-service)
  # ============================================
  validate-go:
    name: Validate Go Code (donation-service)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Verify Go Modules & Dependencies
        working-directory: ./donation-service
        run: |
          echo "Verificando integridade das dependencias Go..."
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "Erro: go.mod ou go.sum desatualizados. Rode 'go mod tidy'." && exit 1)

      - name: Test Go Build
        working-directory: ./donation-service
        run: |
          echo "Testando compilação do Go..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v ./...

  # ============================================
  # STEP 2: Validação de Serviços Python (ngo-service & volunteer-service)
  # ============================================
  validate-python:
    name: Validate Python Code (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ngo-service
          - volunteer-service
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies & Check Syntax
        working-directory: ./${{ matrix.service }}
        run: |
          echo "Instalando dependencias Python..."
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          echo "Verificando sintaxe dos arquivos Python..."
          python -m py_compile app.py

  # ============================================
  # STEP 3: Validação do Build Docker (Todos os Serviços)
  # ============================================
  validate-docker:
    name: Validate Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [validate-go, validate-python]
    strategy:
      matrix:
        service:
          - donation-service
          - ngo-service
          - volunteer-service
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Validation Only)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: ${{ matrix.service }}:test
