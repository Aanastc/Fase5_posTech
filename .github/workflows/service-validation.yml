name: Service Validation (PR & Push)

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "ngo-service/**"
      - "donation-service/**"
      - "volunteer-service/**"
  push:
    branches:
      - develop
    paths:
      - "ngo-service/**"
      - "donation-service/**"
      - "volunteer-service/**"

jobs:
  # ============================================
  # STEP 1: Validar Dependências e Compilação Go
  # ============================================
  validate-go:
    name: Validate Go Code (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ngo-service
          - donation-service
          - volunteer-service
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Verify Go Modules & Dependencies
        run: |
          cd ${{ matrix.service }}
          echo "Verificando integridade das dependencias..."
          go mod verify

          # Garante que o go.mod não tem alterações pendentes
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "Erro: O arquivo go.mod ou go.sum precisa passar por 'go mod tidy'" && exit 1)

      - name: Test Go Build
        run: |
          cd ${{ matrix.service }}
          echo "Testando compilação do serviço..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v ./...

      - name: Run Unit Tests (se existirem)
        run: |
          cd ${{ matrix.service }}
          go test -v ./... || echo "Nenhum teste unitario encontrado ou falha em testes."

  # ============================================
  # STEP 2: Validar Build do Dockerfile
  # ============================================
  validate-docker:
    name: Validate Docker Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: validate-go
    strategy:
      matrix:
        service:
          - ngo-service
          - donation-service
          - volunteer-service
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Validation Only)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false # Não faz push para o ECR, apenas testa o build
          tags: ${{ matrix.service }}:test
